<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wiid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="22" fill="#0A0E17" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="url(#wiid-grad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Stylized W / Terminal Brackets Motif -->
  <path d="M 22 36 L 36 68 L 50 44 L 64 68 L 78 36" fill="none" stroke="url(#wiid-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="50" cy="28" r="4" fill="#00F0FF" />
</svg>
