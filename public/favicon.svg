<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wiid-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#9B51E0" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#07070A" />
  <rect width="96" height="96" x="2" y="2" rx="18" fill="none" stroke="url(#wiid-border-grad)" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- WIID Brand Logo Mark -->
  <text x="50" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Space Mono', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="1">
    <tspan fill="#FFFFFF">WI</tspan><tspan fill="#FF007A">I</tspan><tspan fill="#FFFFFF">D</tspan>
  </text>
  
  <!-- Accent Glow Dot -->
  <circle cx="58" cy="38" r="3.5" fill="#FF007A" />
</svg>
